<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TradeScrim — Free Paper Trading Simulator for Stocks &amp; Crypto</title>
    <meta
      name="description"
      content="Practice trading stocks and crypto with real, live market prices using $10,000 in free virtual cash. No signup fees, no real money at risk — track your P&L, build a watchlist, set price alerts, and learn the basics of investing."
    />
    <link rel="canonical" href="https://tradescrim.com/" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0b111f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f7fb" media="(prefers-color-scheme: light)" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph / Facebook, Discord, Slack, iMessage, etc. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tradescrim.com/" />
    <meta property="og:site_name" content="TradeScrim" />
    <meta property="og:title" content="TradeScrim — Free Paper Trading Simulator for Stocks & Crypto" />
    <meta
      property="og:description"
      content="Practice trading stocks and crypto with real, live market prices using $10,000 in free virtual cash. No signup fees, no real money at risk."
    />
    <meta property="og:image" content="https://tradescrim.com/og-image.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TradeScrim — Free Paper Trading Simulator for Stocks & Crypto" />
    <meta
      name="twitter:description"
      content="Practice trading stocks and crypto with real, live market prices using $10,000 in free virtual cash."
    />
    <meta name="twitter:image" content="https://tradescrim.com/og-image.svg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "TradeScrim",
        "url": "https://tradescrim.com/",
        "description": "A free paper-trading simulator for practicing stock and crypto investing with real, live market prices and $10,000 in virtual cash.",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Any (web-based)",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1940314723028167"
     crossorigin="anonymous"></script>
    <script>
      (function () {
        var stored = localStorage.getItem('tradescrim-theme');
        var theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
